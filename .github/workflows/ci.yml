# First CI for DocSuri — closes the "no automated gate" finding (aidlc-state.md §검증 재기준선).
# One job per uv project (they are independent packages). Each runs lint + tests; `shared` also
# runs the schema drift guard so a stale _generated/ fails the PR. The repo-root tests/ suite
# (accounts U3 + library U4) runs in the `root-suites` job below; that job's lint step also gates
# the tests/ tree so unused-import (F401) debt can't reappear invisibly.
#
# Third-party actions are pinned to a commit SHA (not a mutable major tag) — a hijacked tag can't
# silently run in CI. The trailing `# vX` comment records the human-readable version. (audit Med #6)
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid push train doesn't stack full CI runs. (audit Low #8)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared:
    name: shared (SSOT · drift · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: shared/python
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Schema drift guard (generated bindings match the SSOT)
        run: uv run python tools/generate.py --check
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -rs

  ingestion:
    name: ingestion (U1)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingestion
    # The control-plane store's SQL only ever ran in deployment: its test is DSN-gated, so
    # without a service container it skips here exactly as it does locally, and a skip reads
    # as a pass. Give it a throwaway Postgres so the gate actually opens.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: docsuri
          POSTGRES_DB: docsuri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      - name: Apply control-plane migrations
        run: |
          for f in migrations/postgres/*.sql; do
            echo "applying $f"
            PGPASSWORD=docsuri psql -h localhost -U postgres -d docsuri -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Tests
        env:
          DOCSURI_TEST_PG_DSN: postgresql://postgres:docsuri@localhost:5432/docsuri
        run: uv run pytest -rs

  discovery:
    name: discovery (U2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/modules/discovery
    # The k-NN/BM25 adapters were covered only by mocks: the integration test needs both the
    # `real` extra AND a reachable cluster, and CI installed neither, so it skipped twice over.
    # The test seeds its own corpus, so a bare single-node cluster is enough.
    services:
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      # `real` in addition to `api`: without opensearch-py the integration module skips at import.
      - name: Tests (api router + real read-path adapters)
        env:
          DOCSURI_OPENSEARCH_ENDPOINT: http://localhost:9200
          DOCSURI_OPENSEARCH_USE_SSL: "false"
          DOCSURI_OPENSEARCH_VERIFY_CERTS: "false"
        run: uv run --extra api --extra real pytest -rs

  summarization:
    name: summarization (U7)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/modules/summarization
    # Same reason as the ingestion lane: the FR-17 reader's SQL is DSN-gated and was skipping.
    # The test creates its own DDL, so an empty database is enough. minio + redis stand in for
    # the retired AWS deployment the integration tests used to target — boto3 honours
    # AWS_ENDPOINT_URL_S3, so the adapters are the shipped ones, unmodified.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: docsuri
          POSTGRES_DB: docsuri
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      # Started as a step, not a `services:` entry: minio needs the `server /data` command and
      # service containers cannot set one. Pinned by digest — the tag is mutable.
      - name: Start MinIO (S3 stand-in)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=docsuri -e MINIO_ROOT_PASSWORD=docsuri123 \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && echo "minio ready" && exit 0
            sleep 2
          done
          echo "minio failed to start" >&2
          docker logs minio >&2
          exit 1
      # --all-extras, not `--extra api` like discovery: test_docmodel_endpoint.py imports the S3
      # adapter (botocore, from the `real` extra) at collection time and does NOT self-skip when
      # it's absent. The live-service integration tests still self-skip without credentials.
      - name: Tests (needs the `real` extra — s3_docmodel imports botocore)
        env:
          DOCSURI_TEST_PG_DSN: postgresql://postgres:docsuri@localhost:5432/docsuri
          # Local stand-ins for the retired AWS deployment. The integration tests create the
          # bucket themselves and never call an LLM, so the key is a placeholder.
          DOCSURI_SUMMARY_BUCKET: docsuri
          DOCSURI_REDIS_URL: redis://localhost:6379/0
          DATABASE_URL: postgresql://postgres:docsuri@localhost:5432/docsuri
          AWS_ENDPOINT_URL_S3: http://localhost:9000
          AWS_ACCESS_KEY_ID: docsuri
          AWS_SECRET_ACCESS_KEY: docsuri123
          AWS_REGION: us-east-1
          DOCSURI_LLM_PROVIDER: openai
          OPENAI_API_KEY: placeholder-no-llm-call-in-these-tests
        run: uv run --all-extras pytest -rs

  ops:
    name: ops (U6 reliability/detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest -rs

  backend:
    name: backend app-shell (mounts U2/U3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    # u12's redis job-queue adapter (locks, claim/release, visibility timeout) was verified only
    # against a fake: its integration test is URL-gated and this lane had no redis, so it skipped.
    # The loop's execution lock is exactly the thing a fake cannot prove.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Lint
        run: uv run ruff check .
      - name: Tests (asserts discovery actually mounts)
        env:
          NOVELTY_TEST_REDIS_URL: redis://localhost:6379/1
        run: uv run pytest -rs

  root-suites:
    name: accounts + library (root tests/ — U3 · U4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      # Root tests/ (accounts U3 + library U4) import backend.modules.* and need the backend
      # env (incl. hypothesis + pytest-asyncio). Run from the repo root via the root pytest.ini
      # (pythonpath=. · asyncio_mode=auto).
      #
      # The lint step passes backend/modules WHOLE, not a list of module names. The app-shell
      # ruff config excludes modules/, so nothing under it is linted by default — and the
      # enumeration this replaced silently left novelty, evidence, research, mypage,
      # citation_graph and personalization unlinted in every lane. An allowlist you have to
      # remember to extend is the same bug waiting to happen, so the default is now "covered".
      # Per-subtree ruff.toml/pyproject still governs each module (discovery and summarization
      # keep their own rules and their own lanes); explicit CLI paths bypass the exclusion.
      # tests/ has no other lane at all.
      - name: Lint (backend modules + root tests/)
        run: uv run --project backend ruff check backend/modules tests
      - name: Tests (accounts + library)
        run: uv run --project backend pytest tests -c pytest.ini -rs

  frontend:
    name: frontend (U5 · tsc + vitest + type drift + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9.15.9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript check
        run: pnpm exec tsc --noEmit
      - name: Type drift guard (generated types match shared/ schemas)
        run: pnpm run gen:types && git diff --exit-code types/
      - name: Lint
        run: pnpm run lint
      - name: Tests
        run: pnpm exec vitest run
      # tsc + vitest don't webpack-compile the routes, so a build-only break (e.g. a
      # server-only module leaking into the client graph via the /bff route) passes both
      # yet fails `next build`. This step is the guard that actually compiles every route.
      - name: Build
        run: pnpm exec next build

  dependency-review:
    name: Dependency review (PR-only · npm + pip)
    # Reviews the PR's dependency-graph diff (pnpm + Python) and fails only on a NEWLY introduced
    # vulnerable dependency — closes the frontend-deps-unscanned gap without blocking on
    # pre-existing debt. Public repo, so no Advanced Security needed. PR-only (no base ref on push).
    # (audit Med #5)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  security:
    name: Security Scan (SCA + Secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Run pip-audit on Backend
        run: |
          uv pip compile backend/pyproject.toml -o backend/requirements.txt
          # drop first-party editable path deps (not on PyPI; their third-party deps are already flattened in)
          grep -v '^-e ' backend/requirements.txt > backend/requirements.audit.txt
          uvx pip-audit -r backend/requirements.audit.txt
      - name: Run pip-audit on Ingestion
        run: |
          uv pip compile ingestion/pyproject.toml -o ingestion/requirements.txt
          # drop first-party editable path deps (not on PyPI; their third-party deps are already flattened in)
          grep -v '^-e ' ingestion/requirements.txt > ingestion/requirements.audit.txt
          uvx pip-audit -r ingestion/requirements.audit.txt
      - name: Run pip-audit on Ops
        run: |
          uv pip compile ops/pyproject.toml -o ops/requirements.txt
          # drop first-party editable path deps (not on PyPI; their third-party deps are already flattened in)
          grep -v '^-e ' ops/requirements.txt > ops/requirements.audit.txt
          uvx pip-audit -r ops/requirements.audit.txt
      # BLOCKING, license-free secret scan. The gitleaks-action v2 needs an org licence (why the
      # old step was continue-on-error/advisory), so run the gitleaks CLI via its pinned image and
      # fail on any finding. --no-git scans the CURRENT tree (what this PR delivers) rather than
      # full history, so it gates new secrets without red-flagging pre-existing history leaks (which
      # need rotation + a history scrub, not a merge block). Allowlist false positives in
      # .gitleaks.toml; tighten to PR-range history later if wanted. (audit Med #4)
      - name: Gitleaks secret scan (blocking)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source /repo --no-git --redact -v --exit-code 1
