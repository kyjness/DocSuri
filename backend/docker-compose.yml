# Full-local backend dependencies (deploy unit ① support services).
# Optional: the app-shell boots without these (SQLite, no Redis). Bring them up when you
# need the accounts (U3) module's real persistence + session store, or the discovery (U2)
# real search read path (OpenSearch).
#
#   docker compose -f backend/docker-compose.yml up -d
#   export DATABASE_URL=postgresql+psycopg://docsuri:docsuri@localhost:5432/docsuri
#
# discovery (U2) real read path — point the reader at local OpenSearch + seed a mini-corpus:
#   export DOCSURI_OPENSEARCH_ENDPOINT=http://localhost:9200
#   export DOCSURI_OPENSEARCH_USE_SSL=0 DOCSURI_OPENSEARCH_VERIFY_CERTS=0
#   uv run --extra real python -m discovery.scripts.seed_local_opensearch   # from modules/discovery
#   uv run --extra real --extra dev pytest -m integration

# Project name pins the network/volume prefix (else it defaults to the directory name,
# "backend"); container_name pins each container (no "-1" replica suffix).
name: docsuri

services:
  postgres:
    container_name: docsuri-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: docsuri
      POSTGRES_PASSWORD: docsuri
      POSTGRES_DB: docsuri
    ports:
      - "5432:5432"
    volumes:
      - docsuri-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsuri"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: docsuri-redis
    image: redis:7
    # accounts/U3 is Fail-Closed on session-store loss (NFR-Design) — multi-AZ in prod;
    # a single node is fine for local dev.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # discovery (U2) read path. Single-node, security plugin OFF for local dev → plain HTTP on
  # 9200 (set DOCSURI_OPENSEARCH_USE_SSL=0). k-NN (cosine, 1024-dim) is bundled. The U1 writer
  # and U2 reader share ONE index (docsuri-corpus-v1, vector-spec §4).
  opensearch:
    container_name: docsuri-opensearch
    image: opensearchproject/opensearch:2.19.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - docsuri-osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 substitute — s3proxy serves a downloaded mirror as a bucket, so client code is unchanged.
  # s3proxy (jclouds filesystem backend) serves the downloaded S3 mirror as plain files:
  # bucket ``docsuri`` = the mounted directory, keys = its file tree, no import/duplication.
  # (MinIO was tried first and rejected: it refuses sub-mounts under its export path and
  # modern releases dropped plain-directory serving entirely.)
  # boto3 ≥1.28 picks the endpoint up from AWS_ENDPOINT_URL_S3 — no adapter changes:
  #   export AWS_ENDPOINT_URL_S3=http://localhost:9000
  #   export AWS_ACCESS_KEY_ID=docsuri AWS_SECRET_ACCESS_KEY=docsuri-local
  #   export DOCSURI_S3_BUCKET=docsuri DOCSURI_DOCMODEL_BUCKET=docsuri
  # Served rw: summary-cache writes land as additive JSONs under s3/summaries/ (accepted).
  # Local dev only — do not reuse for anything internet-facing.
  s3proxy:
    container_name: docsuri-s3proxy
    image: andrewgaul/s3proxy
    environment:
      # 로컬 전용 대역이고, 인증을 켜두면 .env에 가짜 AWS 키를 둬야 하는데 그 값이
      # boto3 환경변수 우선순위 때문에 Bedrock 호출까지 덮어쓴다. 인증을 끄면 진짜
      # 자격증명이 프로필에서 잡히고 s3proxy는 서명을 무시한다.
      S3PROXY_AUTHORIZATION: none
      S3PROXY_IDENTITY: docsuri
      S3PROXY_CREDENTIAL: docsuri-local
      # U1's S3 writers always request SSE (s3_put encrypts unconditionally by design); the
      # filesystem backend cannot honour it and would fail every PUT with NotImplemented.
      # Ignoring the header locally keeps the production writers untouched.
      S3PROXY_IGNORE_UNKNOWN_HEADERS: "true"
      JCLOUDS_PROVIDER: filesystem
      JCLOUDS_FILESYSTEM_BASEDIR: /data
    ports:
      - "9000:80"
    volumes:
      # 기본값을 두지 않는다. `:-~/data/docsuri-data/s3`였을 때, .env를 소스하지 않고
      # `docker compose up -d`를 한 번 한 것만으로 24GB 개발 코퍼스가 조용히 마운트됐다.
      # 컨테이너는 healthy로 뜨고 S3 API도 정상 응답하므로 어디에도 오류가 안 보이는데,
      # 재색인 도구는 배포 코퍼스 781편 중 771편을 "doc-model 없음"으로 건너뛰고 exit 0을
      # 냈고, 인제스천은 개발 코퍼스 파일 376개를 덮어썼다(2026-08-18). 조용히 틀린 데이터를
      # 붙드느니 뜨지 않는 편이 낫다.
      - ${DOCSURI_S3_MIRROR:?DOCSURI_S3_MIRROR must be set — source .env first}:/data/docsuri
    healthcheck:
      # curl, not /dev/tcp: that redirect is a bash builtin and CMD-SHELL runs /bin/sh, so the
      # probe failed on every single tick ("Directory nonexistent") while s3proxy served fine.
      # A container that is permanently unhealthy reports nothing — the next real outage reads
      # identically to this one.
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # u1 ingestion parser (TEI) for the PDF/GROBID tier AND all non-arXiv sources — S2/OpenAlex have
  # no ar5iv HTML, so GROBID TEI is their only structure parser. Dormant while the local stack only
  # SERVES the pre-built doc-model mirror (no live parsing), which is why it is behind an OPT-IN
  # profile: default `up` skips this multi-GB, memory-heavy image. Bring it up only when you
  # (re-)ingest locally, and set DOCSURI_GROBID_URL=http://localhost:8070 to wire it:
  #   docker compose -f backend/docker-compose.yml --profile ingest up -d grobid
  # NOTE: 0.8.0 mangles multi-row-header table cells
  # (aidlc-docs/operations/grobid-table-limits.md) — swap for
  # Docling if table-cell accuracy is required.
  grobid:
    container_name: docsuri-grobid
    image: grobid/grobid:0.8.0
    profiles: ["ingest"]
    ports:
      - "8070:8070"
    environment:
      # The image bakes in `-Xmx4g`. On a 7.5GB box that is not a ceiling the JVM respects
      # reluctantly — it is a licence to grow, and the heap does grow across requests and is never
      # returned. Measured: 1.96GB idle, 3.4GB after 60 papers. Capping the CONTAINER instead
      # (`docker update --memory`) does not help and actively hurts: the JVM still believes it has
      # 4GB of heap, so the cgroup kills it (exit 137) before it ever feels pressure to collect.
      # The number to lower is this one.
      # 2g는 이 박스에서 부족했다: 재기동 직후 2.0GB로 뜨고, 한 편을 파싱하는 사이 남은
      # 1.7GB를 다 먹어 커널이 죽였다(exit 137, 8편 라운드에서 즉시). 컨테이너 상한을
      # 거는 것은 도움이 안 된다 — JVM은 여전히 자기 힙이 다 있다고 믿어서, 압박을 느끼기
      # 전에 cgroup이 먼저 죽인다. 낮출 수 있는 숫자는 이것뿐이라 env로 뺀다.
      JAVA_OPTS: "-Xmx${DOCSURI_GROBID_HEAP:-2g}"
    # Model load takes a while; a port-open check is a fine readiness proxy (the image ships no curl).
    # `/dev/tcp` is a bash feature, so invoke bash explicitly — CMD-SHELL runs /bin/sh (dash on this
    # Debian-based image), which has no /dev/tcp and would report the container perpetually unhealthy.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8070"]
      interval: 10s
      timeout: 5s
      retries: 20

  # SQS stand-in for the ingestion job queue, the same way s3proxy stands in for S3. Without it
  # the harvest path cannot run locally AT ALL: `trigger_full_rebuild` enqueues every harvested
  # paper and a worker drains it, so with no queue there is nothing to drain and the recent-slice
  # half of ⑧-2 has no way to execute. The queue was pointed at a placeholder URL
  # (`unused.local/queue-not-wired-locally`), which is why the local corpus was built by one-off
  # scripts instead — a path production never takes.
  #
  # No code change is needed to use it: botocore reads `AWS_ENDPOINT_URL_SQS`, exactly as the S3
  # adapters read `AWS_ENDPOINT_URL_S3`. Deploying to real SQS is then a matter of dropping that
  # variable.
  #
  # Queues are declared in elasticmq.conf (main + DLQ) so they exist on boot rather than being
  # created by whichever process happens to run first.
  elasticmq:
    container_name: docsuri-elasticmq
    image: softwaremill/elasticmq-native:1.6.11
    profiles: ["ingest"]
    ports:
      - "9324:9324"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      # netstat, not the /dev/tcp trick the other services use: this image is busybox with no
      # bash, so /dev/tcp does not exist and the check reported a working queue as unhealthy.
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':9324 '"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  docsuri-pgdata:
  docsuri-osdata:
