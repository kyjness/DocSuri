# ElasticMQ queues for the local ingestion stack — the SQS stand-in (see docker-compose.yml).
#
# Declared here rather than created at runtime so the queues exist the moment the container is
# healthy: the enqueue side and the worker are separate processes, and whichever starts first
# would otherwise have to know how to create them.

include classpath("application.conf")

node-address {
  protocol = http
  host = "localhost"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # Accept whatever host the client used. The container's own view of its address is not the
  # client's, and a mismatch makes every returned QueueUrl unreachable from the host.
  sqs-limits = strict
}

queues {
  docsuri-ingest {
    # Long enough for a whole paper — fetch, parse, page-crop rendering, embedding and indexing.
    # Measured at 14.0s per paper on the 20-paper trial; a paper on the PDF/GROBID rung with a
    # Docling table re-read costs far more (26.9s of re-read alone), so this is set well above
    # the worst observed rather than near the average. Too short and the message reappears while
    # the first attempt is still working on it.
    visibilityTimeout = 900 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "docsuri-ingest-dlq"
      # Three attempts, then the paper is set aside. The pipeline already retries inside a single
      # attempt (5x behind a circuit breaker), so redelivery is for whole-process failures — a
      # crash, an OOM kill — not for a flaky dependency.
      maxReceiveCount = 3
    }
  }
  docsuri-ingest-dlq { }
}
