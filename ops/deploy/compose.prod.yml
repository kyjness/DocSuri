# 데모 배포(로드맵 ⑪) — 8 GB 박스 한 대. 로컬 `backend/docker-compose.yml`을 이관한 것이고,
# 다른 점만 여기에 적는다.
#
# **로컬에 있고 여기 없는 것**
# - `s3proxy` — 실 S3를 쓴다. 24 GB 자산을 박스 디스크에 얹으면 색인 몫을 먹는다.
# - `grobid` — 파싱 스택을 안 올린다(질문지 Q7=B). 색인은 로컬에서 만들어 올린다.
# - `elasticmq` — SQS 대역이 필요 없다. 배포에는 색인 큐도, 그것을 소비할 워커도 없다.
#
# **로컬에 없고 여기 있는 것**
# - `caddy` — TLS 종단. Let's Encrypt 인증서를 자동으로 받고 갱신한다.
# - `frontend`·`backend` — 로컬은 호스트에서 직접 띄우지만(`./dev.sh`) 여기서는 컨테이너다.
#
# **포트를 밖으로 내는 것은 caddy뿐이다.** 나머지는 전부 내부 네트워크로만 닿는다 —
# OpenSearch가 보안 플러그인을 끈 채로 돌기 때문에, 9200이 한 번 새면 인증 없이 코퍼스가
# 통째로 읽힌다. 방화벽(`terraform/lightsail.tf`)과 여기, 두 겹으로 막는다.

name: docsuri

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # 인증서 — 이 볼륨이 날아가면 재발급 한도에 걸릴 수 있다
      - caddy-config:/config
    environment:
      DOCSURI_DOMAIN: ${DOCSURI_DOMAIN:?set DOCSURI_DOMAIN}
    depends_on:
      - frontend
      - backend

  frontend:
    build:
      # **두 이미지의 컨텍스트가 다르다.** 프론트는 `frontend/`를 루트로 보고
      # (`COPY package.json ./`), 백엔드는 저장소 루트를 본다(`COPY shared/python ...`).
      # CD 워크플로도 프론트를 `docker build -f frontend/Dockerfile ... frontend/`로 짓는다 —
      # 여기만 다르게 두면 배포 이미지와 CD 이미지가 갈린다.
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # `NEXT_PUBLIC_*`는 **빌드 시점에 박힌다.** 런타임 environment로 주면 아무 일도
        # 일어나지 않고 화면만 조용히 다르게 뜬다 — Novelty 게이트가 정확히 그 자리다.
        NEXT_PUBLIC_DOCSURI_REAL_API: "1"
        NEXT_PUBLIC_DOCSURI_EVIDENCE_AGENT_ENABLED: "1"
        NEXT_PUBLIC_DOCSURI_NOVELTY_ENABLED: ""
    restart: unless-stopped
    environment:
      # **브라우저는 백엔드를 직접 안 부른다.** 클라이언트는 같은 출처의 `/bff/*`(Next 서버
      # 라우트)를 치고, 게이트웨이 주소를 아는 곳은 거기 하나다 — 세션 쿠키가 클라이언트
      # JS로 안 들어가게 하려는 설계다(SEC-3/12). 그래서 이 값이 **런타임** env여야 한다:
      # `NEXT_PUBLIC_*`가 아니므로 빌드 인자로 주면 서버 프로세스가 못 본다.
      #
      # 비어 있으면 BFF는 프로덕션에서 **fail-closed**로 끊는다(mock으로 안 떨어진다).
      # 즉 화면이 통째로 오류가 되지, 가짜 데이터가 진짜인 척하지는 않는다.
      DOCSURI_GATEWAY_URL: http://backend:8000
    expose:
      - "3000"

  backend:
    build:
      # 저장소 루트. compose 파일이 `ops/deploy/`에 있으므로 `..`는 `ops/`이고,
      # 그러면 `shared/python`을 못 찾는다(실배포에서 걸렸다).
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsuri
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: docsuri_deploy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsuri -d docsuri_deploy"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data

  opensearch:
    image: opensearchproject/opensearch:2.19.0
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      # 힙을 1 GB로 둔다. 색인은 `on_disk` 모드라 k-NN 그래프가 **RAM에 상주하지 않고**
      # (`graph_memory_usage: 0`) 실제 제약은 디스크·페이지캐시다 — 힙을 키우면 페이지캐시가
      # 줄어 오히려 느려진다. 편수 천장 약 3,500편의 근거가 그 실측(편당 1.73 MB)이다.
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      bootstrap.memory_lock: "true"
      # 스냅샷 복원 경로. 색인은 로컬에서 만들어 스냅샷으로 옮기므로(§12.4 — 파싱 스택을
      # 박스에 안 올린다) 이 저장소가 **색인이 박스에 들어오는 유일한 통로**다. 백업을
      # 뜰 때도 같은 자리를 쓴다.
      path.repo: /snapshots
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - osdata:/usr/share/opensearch/data
      # 저장소 트리 **밖**이다 — rsync가 나르는 대상이 아니고, 5 GB짜리 스냅샷이 소스와
      # 함께 오가면 배포마다 그것을 다시 밀게 된다.
      - ../../os-snapshot:/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
  osdata:
  redisdata:
  caddy-data:
  caddy-config:
